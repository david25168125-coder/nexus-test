name: nexus_app
description: Digitize Nexus Home Energy & Automation Dashboard
publish_to: "none"

version: 1.0.1+30

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Networking / state
  http: ^1.2.0
  provider: ^6.0.5
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1   

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"  
  remove_alpha_ios: true             

flutter:
  uses-material-design: true

  assets:
    - assets/digitize_logo.png
    - assets/app_icon.png            
    - assets/systems/
    - assets/fonts/
    - assets/digitize_nexus_logo.png
    - assets/ev_ui/MG_logo.png

  fonts:
    - family: TeslaIcons
      fonts:
        - asset: assets/fonts/TeslaIcons.ttf

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
